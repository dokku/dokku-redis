---
services:
  redis:
    image: "{{ .Image }}:{{ .ImageVersion }}"

    # the config path follows the config volume, so a service that moved it
    # still starts on its own file
    command:
      - redis-server
      - "{{ .Target.config }}/redis.conf"
      - --bind
      - 0.0.0.0
      # the users made in the service, beside the default one. In the data
      # volume, which redis owns, since saving them writes the file again
      - --aclfile
      - "{{ .Target.data }}/users.acl"
      # after the config file, so the service memory wins over a maxmemory
      # line in it. Both elements render to nothing without one, and are left
      # out, so redis keeps whatever its config says
      - "{{ if .ServiceMemory }}--maxmemory{{ end }}"
      - "{{ if .ServiceMemory }}{{ .ServiceMemory }}mb{{ end }}"

    # redis writes its dump to its working directory, and the image's
    # entrypoint hands its working directory to the redis user before starting
    # it. Starting in the data volume, wherever it is mounted, is what has redis
    # write its dump there and be allowed to
    working_dir: "{{ .Target.data }}"

    volumes:
      - type: bind
        source: "{{ .HostRoot }}/config"
        target: /usr/local/etc/redis
      - type: bind
        source: "{{ .HostRoot }}/data"
        target: /data

    configs:
      - source: redis_conf
        target: /usr/local/etc/redis/redis.conf
      - source: users_acl
        target: /data/users.acl
        mode: "0640"

    ports:
      - name: native
        target: 6379
        primary: true

configs:
  # seeded once into the config directory and never rewritten, so an operator
  # editing redis.conf keeps the edit. The Go implementation instead rewrites
  # the requirepass line on every create, which means a file supplied through
  # REDIS_CONFIG_PATH becomes the operator's responsibility for auth here. A
  # password change writes the requirepass line over and leaves the rest.
  redis_conf:
    content: |
      requirepass {{ .Secret.password }}

  # redis reads its users from here once it is told to, the default one
  # included, which would otherwise be left with no password at all. It is
  # seeded with the default user alone and written by redis from then on.
  users_acl:
    content: |
      user default on >{{ .Secret.password }} ~* &* +@all

x-dokku:
  plugin: redis
  title: Redis
  scheme: redis
  alias: REDIS
  # the default user and database are left out, as they always have been, so a
  # link on them keeps the url it was given
  dsn: "{{ .Scheme }}://{{ if ne .Username .DefaultUsername }}{{ .Username }}{{ end }}:{{ .Password }}@{{ .Host }}:{{ .Port.native }}{{ if ne .Database .DefaultDatabase }}/{{ .Database }}{{ end }}"

  # the redis image ships no probe whose exit status can be trusted without the
  # password, so readiness stays on the dokku/wait sidecar that every datastore
  # uses today rather than on a compose healthcheck
  wait: native

  hooks:
    pre_create:
      # the image's entrypoint hands the data volume to the redis user only
      # while it holds nothing but dumps, so the seeded acl file would leave
      # both it and the volume unreadable to redis. It runs as root with the
      # entrypoint cleared, since the entrypoint would start redis rather than
      # run this.
      user: "0"
      entrypoint: ""
      volumes:
        - type: bind
          source: "{{ .HostRoot }}/data"
          target: /seed-data
      exec: ["chown", "-R", "redis:redis", "/seed-data"]

  # redis always holds sixteen databases, numbered from zero, so a link only
  # says which it wants and there is none to make. The bound is the redis
  # default rather than the databases line of the service's own config, which
  # an operator raising it would have to keep in step with
  databases:
    fixed: 16
    default: "0"

  # a user is an acl user with every permission the default user has, kept in
  # the acl file in the data volume so that it outlives a restart. Each change
  # is saved to the file as it is made. A service made before the file was
  # read has nowhere to keep one until its container is made again. The
  # password is read from stdin rather than passed as an argument, so it stays
  # out of the container's process table.
  users:
    default: default
    secret: password
    create:
      exec:
        - sh
        - -c
        - |
          set -e
          aclfile="$(redis-cli --no-auth-warning CONFIG GET aclfile | sed -n 2p)"
          if [ -z "$aclfile" ]; then
            echo "the service has nowhere to keep its users, which it is only given once its container has been made again: run dokku redis:stop and then dokku redis:start" >&2
            exit 1
          fi
          reply="$(printf '>%s' "$NEW_PASSWORD" | redis-cli --no-auth-warning -x ACL SETUSER "$1" on "~*" "&*" "+@all")"
          if [ "$reply" != OK ]; then
            echo "$reply" >&2
            exit 1
          fi
          reply="$(redis-cli --no-auth-warning ACL SAVE)"
          if [ "$reply" != OK ]; then
            echo "unable to save the users: $reply" >&2
            exit 1
          fi
        - dokku-redis-create-user
        - "{{ .Args.user }}"
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"
    destroy:
      exec:
        - sh
        - -c
        - |
          set -e
          reply="$(redis-cli --no-auth-warning ACL DELUSER "$1")"
          if [ "$reply" != 1 ]; then
            echo "$reply" >&2
            exit 1
          fi
          reply="$(redis-cli --no-auth-warning ACL SAVE)"
          if [ "$reply" != OK ]; then
            echo "unable to save the users: $reply" >&2
            exit 1
          fi
        - dokku-redis-destroy-user
        - "{{ .Args.user }}"
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
    change:
      exec:
        - sh
        - -c
        - |
          set -e
          reply="$(printf '>%s' "$NEW_PASSWORD" | redis-cli --no-auth-warning -x ACL SETUSER "$1" resetpass)"
          if [ "$reply" != OK ]; then
            echo "$reply" >&2
            exit 1
          fi
          reply="$(redis-cli --no-auth-warning ACL SAVE)"
          if [ "$reply" != OK ]; then
            echo "unable to save the users: $reply" >&2
            exit 1
          fi
        - dokku-redis-change-user-password
        - "{{ .Args.user }}"
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
        NEW_PASSWORD: "{{ .NewSecret }}"

  secrets:
    password:
      file: PASSWORD
      length: 64
      env: SERVICE_PASSWORD

      # the password is in the seeded config file, which is never written
      # again, so redis is told the new one while it runs and the line in the
      # file is written over to match, keeping the rest of the file, its owner
      # and its mode. The new password is read from stdin rather than passed
      # as an argument, so it stays out of the container's process table.
      change:
        user: "0"
        exec:
          - sh
          - -c
          - |
            set -e
            config="$1"
            reply="$(printf '%s' "$NEW_PASSWORD" | redis-cli --no-auth-warning -x CONFIG SET requirepass)"
            if [ "$reply" != OK ]; then
              echo "$reply" >&2
              exit 1
            fi
            updated="$(while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                requirepass\ *|requirepass) printf 'requirepass %s\n' "$NEW_PASSWORD" ;;
                *) printf '%s\n' "$line" ;;
              esac
            done < "$config")"
            case "$updated" in
              *"requirepass $NEW_PASSWORD"*) ;;
              *) updated="$(printf '%s\nrequirepass %s' "$updated" "$NEW_PASSWORD")" ;;
            esac
            printf '%s\n' "$updated" > "$config"
            # the acl file holds the default user too, and would bring the
            # old password back the next time redis starts
            aclfile="$(REDISCLI_AUTH="$NEW_PASSWORD" redis-cli --no-auth-warning CONFIG GET aclfile | sed -n 2p)"
            if [ -n "$aclfile" ]; then
              reply="$(REDISCLI_AUTH="$NEW_PASSWORD" redis-cli --no-auth-warning ACL SAVE)"
              if [ "$reply" != OK ]; then
                echo "unable to save the new password to the acl file: $reply" >&2
                exit 1
              fi
            fi
          - dokku-redis-change-password
          - "{{ .Target.config }}/redis.conf"
        env:
          REDISCLI_AUTH: "{{ .Secret.password }}"
          NEW_PASSWORD: "{{ .NewSecret }}"

  # redis takes a new maxmemory while it runs, so a change is told to it rather
  # than waiting for the container to be made again. Cleared, it goes back to
  # the maxmemory line in the config file, or to no limit without one, which
  # is what a restart would start it with. The value is read from the
  # environment, since an argument that renders to nothing is dropped and
  # would move the config path into its place
  service_memory:
    change:
      exec:
        - sh
        - -c
        - |
          config="$1"
          value="$SERVICE_MEMORY"
          if [ -n "$value" ]; then
            value="${value}mb"
          else
            value=0
            if [ -f "$config" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                case "$line" in
                  maxmemory\ *) value="${line#maxmemory }" ;;
                esac
              done < "$config"
            fi
          fi
          reply="$(redis-cli --no-auth-warning CONFIG SET maxmemory "$value")" || exit $?
          if [ "$reply" != OK ]; then
            echo "unable to set maxmemory: $reply" >&2
            exit 1
          fi
        - dokku-redis-service-memory
        - "{{ .Target.config }}/redis.conf"
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
        SERVICE_MEMORY: "{{ .ServiceMemory }}"

  commands:
    # as the user and on the database asked for, each left out when it is the
    # default
    connect:
      exec:
        - redis-cli
        - --no-auth-warning
        - "{{ if ne .Username .DefaultUsername }}--user{{ end }}"
        - "{{ if ne .Username .DefaultUsername }}{{ .Username }}{{ end }}"
        - "{{ if ne .Database .DefaultDatabase }}-n{{ end }}"
        - "{{ if ne .Database .DefaultDatabase }}{{ .Database }}{{ end }}"
      env:
        REDISCLI_AUTH: "{{ .Password }}"
        LANG: C.UTF-8
        LC_ALL: C.UTF-8

    # both dump verbs are vendored scripts, mounted into the container from the
    # service directory rather than baked into an image. Mounting keeps this
    # definition on the pull path, and the dump still streams rather than being
    # buffered through the tool as a string.
    export:
      # runs beside the service rather than inside it, sharing its network
      # namespace. The script is mounted into the sidecar, so a service whose
      # container was created before the script existed, or by the bash plugin,
      # can still be exported without being recreated first.
      mode: sidecar
      exec: ["dokku-redis-export"]
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
        DUMP_FILE: "{{ .Target.data }}/dump.rdb"

    import:
      # redis reads its dump at boot and writes it again on shutdown, so the
      # server has to be down while the dump in the data volume is replaced
      mode: offline
      stdin: true
      exec: ["dokku-redis-import"]
      env:
        DUMP_FILE: "{{ .Target.data }}/dump.rdb"

    # every key in every database, written through to the dump and the append
    # only file as any other write is, so a restart does not bring them back.
    # redis-cli exits zero when the server refuses a command, which a FLUSHALL
    # renamed or denied by the operator's config would be, so the reply is
    # checked rather than the exit
    reset:
      exec:
        - sh
        - -c
        - |
          reply="$(redis-cli --no-auth-warning FLUSHALL)" || exit $?
          if [ "$reply" != OK ]; then
            echo "unable to flush the service: $reply" >&2
            exit 1
          fi
        - dokku-redis-reset
      env:
        REDISCLI_AUTH: "{{ .Secret.password }}"
